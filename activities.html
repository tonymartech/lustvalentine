<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activities</title>
    <link rel="stylesheet" href="css/activities.css" />
  </head>
  <body>
    <div id="activityquestion"><b>What are we doing after?</b></div>
    <div class="activities-selection">
      <div class="activity-item">
        <img src="activities/park.png" alt="Công viên" />
        <label>
          <input type="radio" name="activities" value="park" />Công viên
        </label>
      </div>
      <div class="activity-item">
        <img src="activities/cinema.png" alt="Xem phim" />
        <label>
          <input type="radio" name="activities" value="cinema" />Xem phim
        </label>
      </div>
      <div class="activity-item">
        <img src="activities/aquarium.png" alt="Thủy cung" />
        <label>
          <input type="radio" name="activities" value="aquarium" />Thủy cung
        </label>
      </div>
      <div class="activity-item">
        <img src="activities/billiards.png" alt="Bi-a" />
        <label>
          <input type="radio" name="activities" value="billiards" />Bi-a
        </label>
      </div>
      <div class="activity-item">
        <img src="activities/gaming.png" alt="Chơi game" />
        <label>
          <input type="radio" name="activities" value="gaming" />Chơi game
        </label>
      </div>
      <div class="activity-item">
        <img src="activities/barpub.png" alt="Bar/Pub" />
        <label>
          <input type="radio" name="activities" value="bar" />Bar/Pub
        </label>
      </div>
      <div class="activity-item">
        <img src="activities/mall.png" alt="TTTM" />
        <label>
          <input type="radio" name="activities" value="mall" />TTTM
        </label>
      </div>
      <div class="activity-item">
        <img src="activities/exhibition.png" alt="Triển lãm" />
        <label>
          <input type="radio" name="activities" value="exhibition" />Triển lãm
        </label>
      </div>
      <div class="activity-item">
        <img src="activities/jail.png" alt="Đi tù" />
        <label>
          <input type="radio" name="activities" value="jail" />Đi tù
        </label>
      </div>
    </div>
    <button class="button" onclick="location.href='lastpage.html'">
      Next
    </button>
  </body>
</html>
