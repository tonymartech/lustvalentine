<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Selection</title>
    <link rel="stylesheet" href="css/food.css" />
  </head>
  <body>
    <div id="foodquestion">
      <b>What food would you like to eat?</b>
    </div>

    <div class="food-selection">
      <div class="food-item">
        <img src="food/burger.png" alt="Hamburger" />
        <label>
          <input type="checkbox" name="food" value="Hamburger" />
          Hamburger
        </label>
      </div>
      <div class="food-item">
        <img src="food/pizza.png" alt="Pizza" />
        <label>
          <input type="checkbox" name="food" value="Pizza" /> Pizza
        </label>
      </div>
      <div class="food-item">
        <img src="food/pasta.png" alt="Pasta" />
        <label>
          <input type="checkbox" name="food" value="Pasta" /> Pasta
        </label>
      </div>
      <div class="food-item">
        <img src="food/tacos.png" alt="Tacos" />
        <label>
          <input type="checkbox" name="food" value="Tacos" /> Tacos
        </label>
      </div>
      <div class="food-item">
        <img src="food/chicken.png" alt="Gà rán" />
        <label>
          <input type="checkbox" name="food" value="Gà rán" /> Gà rán
        </label>
      </div>
      <div class="food-item">
        <img src="food/noodles.png" alt="Mì cay" />
        <label>
          <input type="checkbox" name="food" value="Mì cay" /> Mì cay
        </label>
      </div>
      <div class="food-item">
        <img src="food/ramen.png" alt="Ramen" />
        <label>
          <input type="checkbox" name="food" value="Ramen" /> Ramen
        </label>
      </div>
      <div class="food-item">
        <img src="food/sushi.png" alt="Sushi" />
        <label>
          <input type="checkbox" name="food" value="Sushi" /> Sushi
        </label>
      </div>
      <div class="food-item">
        <img src="food/hotpot.png" alt="Lẩu" />
        <label>
          <input type="checkbox" name="food" value="Lẩu" /> Lẩu
        </label>
      </div>
      <div class="food-item">
        <img src="food/bibimbap.png" alt="Bibimbap" />
        <label>
          <input type="checkbox" name="food" value="Bibimbap" /> Bibimbap
        </label>
      </div>
      <div class="food-item">
        <img src="food/grilled.png" alt="Nướng" />
        <label>
          <input type="checkbox" name="food" value="Nướng" /> Nướng
        </label>
      </div>
      <div class="food-item">
        <img src="food/phobun.png" alt="Phở/Bún" />
        <label>
          <input type="checkbox" name="food" value="Phở/Bún" /> Phở/Bún
        </label>
      </div>
    </div>
    <button class="button" onclick="location.href='dessert.html'">
      Continue UWU
    </button>
  </body>
</html>
